# Included in every location: nginx drops server-level add_header directives once a location adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Everything is served by the app itself (PRD §8): no third-party scripts, fonts, images or API calls.
# 'wasm-unsafe-eval' lets PDF.js run its WebAssembly image decoders; worker-src covers the PDF.js worker.
# connect-src 'self' keeps PDFs and signatures from leaving the browser even if a script tried.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
