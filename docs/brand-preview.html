<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨签 InkSign · Logo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eeede9; color: #1e3a5f; font-family: "Microsoft YaHei", sans-serif; }
  main { width: min(1120px, 100%); margin: auto; padding: 44px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 27px; letter-spacing: -1px; }
  header span, footer { font-size: 12px; color: #667080; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  section { padding: 32px; border-radius: 20px; background: #faf9f6; }
  section.dark { background: #14263d; color: #faf9f6; }
  .label { font-size: 11px; letter-spacing: 2px; opacity: .6; }
  .hero { display: flex; justify-content: center; padding: 42px 0 32px; }
  .hero img { width: 144px; height: 144px; }
  .name { text-align: center; font-size: 28px; font-weight: 600; letter-spacing: 3px; }
  .name span { margin-left: 8px; font-size: 20px; font-weight: 400; letter-spacing: -.5px; }
  .sizes { display: flex; height: 112px; gap: 24px; align-items: end; justify-content: center; padding-top: 32px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 8px; font-size: 10px; opacity: .5; }
  footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 26px; }
  @media (max-width: 700px) { main { padding: 24px; } .pair { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
</style>
<main>
  <header><h1>墨签 InkSign</h1><span>品牌图标 / 钢笔笔尖 · 签名收笔</span></header>
  <div class="pair">
    <section>
      <div class="label">01 / 浅色背景</div>
      <div class="hero"><img src="../apps/web/public/brand/logo-light.svg" alt="浅色背景 Logo"></div>
      <div class="name">墨签 <span>InkSign</span></div>
      <div class="sizes">
        <figure><img src="../apps/web/public/brand/logo-light.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-light.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-light.svg" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-light.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      </div>
    </section>
    <section class="dark">
      <div class="label">02 / 深色背景</div>
      <div class="hero"><img src="../apps/web/public/brand/logo-dark.svg" alt="深色背景 Logo"></div>
      <div class="name">墨签 <span>InkSign</span></div>
      <div class="sizes">
        <figure><img src="../apps/web/public/brand/logo-dark.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-dark.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-dark.svg" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
        <figure><img src="../apps/web/public/brand/logo-dark.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      </div>
    </section>
  </div>
  <footer><span>墨蓝 #1E3A5F / 纸白 #FAF9F6</span><span>SVG · PNG · ICO</span></footer>
</main>
</html>
